name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f "ld-metrics-translator/requirements.txt" ]; then pip install -r ld-metrics-translator/requirements.txt; fi
          if [ -f "ld-metrics-translator/requirements-dev.txt" ]; then pip install -r ld-metrics-translator/requirements-dev.txt; fi

      - name: Run tests with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/ld-metrics-translator
        run: |
          pytest -q
