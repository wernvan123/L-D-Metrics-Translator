<section id="roles-panel" class="roles-panel" data-is-admin="{{ 1 if is_admin else 0 }}">
  <style>
    /* Roles panel styles scoped to dashboard inclusion */
    .roles-panel {
      margin-top: 2.5rem;
    }
    .roles-panel-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(235, 240, 255, 0.96));
      border-radius: 20px;
      border: 1px solid rgba(59, 130, 246, 0.18);
      box-shadow: 0 18px 50px rgba(59, 130, 246, 0.18);
      padding: clamp(24px, 3vw, 36px);
      display: grid;
      gap: clamp(20px, 3vw, 28px);
    }
    .roles-panel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .roles-panel-header h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 30px);
      font-weight: 700;
      color: #0b1533;
    }
    .roles-panel-header .roles-actions {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .roles-panel-header .roles-actions .btn {
      border-radius: 14px;
      padding: 10px 18px;
      font-weight: 600;
      box-shadow: 0 16px 42px rgba(59, 130, 246, 0.18);
    }
    .roles-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 16px;
    }
    .roles-controls .field {
      flex: 1 1 380px;
      display: grid;
      gap: 6px;
    }
    .roles-controls .field span {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(17, 24, 39, 0.6);
    }
    .roles-controls input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(59, 130, 246, 0.4);
      background: #ffffff;
      color: #0b1533;
      font-size: 15px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
    }
    .roles-controls button {
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(59, 130, 246, 0.35);
      background: rgba(59, 130, 246, 0.12);
      color: #1d4ed8;
      font-weight: 600;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .roles-controls button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(59, 130, 246, 0.18);
    }
    .roles-table-wrap {
      border-radius: 18px;
      border: 1px solid rgba(59, 130, 246, 0.18);
      background: rgba(255, 255, 255, 0.82);
      overflow: hidden;
      box-shadow: 0 18px 42px rgba(59, 130, 246, 0.12);
    }
    .roles-table-wrap table {
      width: 100%;
      border-collapse: collapse;
      color: #0b1533;
    }
    .roles-table-wrap thead {
      background: rgba(59, 130, 246, 0.1);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 12px;
      color: #1f2937;
    }
    .roles-table-wrap th,
    .roles-table-wrap td {
      padding: 12px 16px;
      vertical-align: middle;
    }
    .roles-table-wrap tbody tr + tr {
      border-top: 1px solid rgba(59, 130, 246, 0.1);
    }
    .roles-table-wrap tbody tr:hover {
      background: rgba(59, 130, 246, 0.08);
    }
    .roles-panel-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .roles-panel-footer .meta {
      margin: 0;
      color: rgba(17, 24, 39, 0.6);
      font-size: 13px;
    }
    @media (max-width: 640px) {
      .roles-panel-card {
        padding: 20px;
      }
      .roles-panel-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .roles-table-wrap,
      .roles-table-wrap table,
      .roles-table-wrap thead,
      .roles-table-wrap tbody,
      .roles-table-wrap th,
      .roles-table-wrap td,
      .roles-table-wrap tr {
        display: block;
      }
      .roles-table-wrap thead {
        display: none;
      }
      .roles-table-wrap tbody tr {
        border-bottom: 1px solid rgba(59, 130, 246, 0.12);
        padding: 12px 0;
      }
      .roles-table-wrap td {
        padding: 6px 0;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 14px;
      }
      .roles-table-wrap td::before {
        content: attr(data-label);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(17, 24, 39, 0.5);
        font-size: 12px;
      }
    }
  </style>

  <div class="roles-panel-card">
    <div class="roles-panel-header">
      <div>
        <h2>Role Architect</h2>
        <p class="meta" style="margin:6px 0 0;color:rgba(17,24,39,0.6);">Manage role profiles directly from the dashboard.</p>
      </div>
      <div class="roles-actions">
        {% if is_admin %}
        <a class="btn primary" href="/admin/roles/new">Create Role Profile</a>
        {% endif %}
        <a class="btn" href="/roles/new">New Role Wizard</a>
      </div>
    </div>

    <div class="roles-controls">
      <label class="field">
        <span>Search</span>
        <input id="roles-search" placeholder="Search role profiles">
      </label>
      <button id="roles-refresh" class="btn" type="button">Refresh</button>
    </div>

    <div id="roles-table-wrap" class="roles-table-wrap" data-is-admin="{{ 1 if is_admin else 0 }}">
      <table class="table">
        <thead>
          <tr>
            <th style="width:36px"></th>
            <th>Name</th>
            <th>Department</th>
            <th>Status</th>
            <th>Created</th>
            <th style="width:120px">Actions</th>
          </tr>
        </thead>
        <tbody id="roles-tbody">
          <tr><td colspan="6">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="roles-panel-footer">
      <button id="compare-reports" class="btn" disabled>Compare Selected Roles</button>
      <p class="meta">Select any two roles to compare their generated reports.</p>
    </div>
  </div>
</section>
