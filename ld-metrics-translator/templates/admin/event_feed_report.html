{% extends "admin/base.html" %}

{% block title %}Diagnostic Report{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">
        <i class="bi bi-clipboard2-pulse me-2"></i>Diagnostic Report
    </h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <a class="btn btn-outline-secondary" href="{{ url_for('admin.event_feed_admin') }}">
                <i class="bi bi-arrow-left me-1"></i>Back to Event Feed
            </a>
            <button type="button" class="btn btn-outline-secondary" id="downloadBtn" disabled>
                <i class="bi bi-download me-1"></i>Download JSON
            </button>
        </div>
    </div>
</div>

<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">Job</h5>
        <div class="small text-muted" id="statusText"></div>
    </div>
    <div class="card-body">
        <div id="errorBox" class="alert alert-danger" style="display:none;"></div>
        <div class="mb-2"><strong>Job ID:</strong> <code id="jobId">{{ job_id }}</code></div>
        <div class="mb-2"><strong>Started At:</strong> <span id="startedAt" class="text-muted">—</span></div>
        <div class="mb-0"><strong>Created At:</strong> <span id="createdAt" class="text-muted">—</span></div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">Report</h5>
    </div>
    <div class="card-body">
        <div id="reportSummary" class="mb-3"></div>
        <div id="reportSections" class="d-grid gap-3"></div>

        <details class="mt-3">
            <summary class="text-muted">Raw JSON</summary>
            <pre id="reportJson" class="mt-2 mb-0" style="white-space: pre-wrap; word-break: break-word; max-height: 65vh; overflow: auto;"></pre>
        </details>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const jobId = '{{ job_id }}';
    const statusText = document.getElementById('statusText');
    const errorBox = document.getElementById('errorBox');
    const createdAt = document.getElementById('createdAt');
    const startedAt = document.getElementById('startedAt');
    const reportJson = document.getElementById('reportJson');
    const reportSummary = document.getElementById('reportSummary');
    const reportSections = document.getElementById('reportSections');
    const downloadBtn = document.getElementById('downloadBtn');

    let lastPayload = null;

    function setError(msg) {
        if (!msg) {
            errorBox.style.display = 'none';
            errorBox.textContent = '';
            return;
        }
        errorBox.style.display = 'block';
        errorBox.textContent = msg;
    }

    function renderJson(obj) {
        try {
            reportJson.textContent = JSON.stringify(obj, null, 2);
        } catch (e) {
            reportJson.textContent = String(obj);
        }
    }

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function badge(text, kind) {
        const k = (kind || '').toLowerCase();
        const cls = (k === 'high') ? 'bg-danger' : (k === 'medium') ? 'bg-warning text-dark' : (k === 'low') ? 'bg-success' : 'bg-secondary';
        return `<span class="badge ${cls}">${escapeHtml(text)}</span>`;
    }

    function renderItemList(items, renderItemHtml) {
        if (!items || !Array.isArray(items) || items.length === 0) {
            return '<div class="text-muted">No items.</div>';
        }
        return `<div class="list-group list-group-flush">${items.map(renderItemHtml).join('')}</div>`;
    }

    function renderSectionCard(title, bodyHtml) {
        return `
            <div class="card">
                <div class="card-header"><strong>${escapeHtml(title)}</strong></div>
                <div class="card-body">${bodyHtml}</div>
            </div>
        `;
    }

    function renderHumanReport(payload) {
        if (!payload) {
            reportSummary.innerHTML = '';
            reportSections.innerHTML = '';
            return;
        }

        const analysis = payload.analysis || {};
        const meta = analysis._meta || {};
        const kb = payload.kb || {};

        const summaryParts = [];
        if (payload.analysis_id) summaryParts.push(`<span><strong>Analysis ID:</strong> ${escapeHtml(payload.analysis_id)}</span>`);
        if (payload.generated_by) summaryParts.push(`<span><strong>Generated by:</strong> ${escapeHtml(payload.generated_by)}</span>`);
        if (meta && meta.role_context_included !== undefined) {
            summaryParts.push(`<span><strong>Role context:</strong> ${meta.role_context_included ? 'Included' : 'Not included'}</span>`);
        }
        reportSummary.innerHTML = summaryParts.length
            ? `<div class="d-flex flex-wrap gap-3">${summaryParts.join('')}</div>`
            : '';

        const sections = [];

        sections.push(renderSectionCard(
            'Learning Needs',
            renderItemList(analysis.learning_needs, (it) => `
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div><strong>${escapeHtml(it?.name || 'Item')}</strong></div>
                        <div class="text-muted small">${escapeHtml(it?.category || '')}</div>
                    </div>
                    <div class="mt-1">${escapeHtml(it?.summary || '')}</div>
                </div>
            `)
        ));

        sections.push(renderSectionCard(
            'Interventions',
            renderItemList(analysis.interventions, (it) => `
                <div class="list-group-item">
                    <div><strong>${escapeHtml(it?.name || 'Intervention')}</strong></div>
                    <div class="mt-1">${escapeHtml(it?.summary || '')}</div>
                </div>
            `)
        ));

        sections.push(renderSectionCard(
            'Recommended Metrics',
            renderItemList(analysis.recommended_metrics, (it) => `
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div><strong>${escapeHtml(it?.name || 'Metric')}</strong></div>
                        <div class="text-muted small">${escapeHtml(it?.category || '')}</div>
                    </div>
                    <div class="mt-1">${escapeHtml(it?.summary || '')}</div>
                </div>
            `)
        ));

        sections.push(renderSectionCard(
            'Success Measures',
            renderItemList(analysis.success_measures, (it) => `
                <div class="list-group-item">
                    <div><strong>${escapeHtml(it?.name || 'Success Measure')}</strong></div>
                    <div class="mt-1">${escapeHtml(it?.summary || '')}</div>
                </div>
            `)
        ));

        sections.push(renderSectionCard(
            'Behavioral Biases',
            renderItemList(analysis.behavioral_biases, (it) => {
                const cms = (it?.countermeasures && Array.isArray(it.countermeasures)) ? it.countermeasures : [];
                const cmsHtml = cms.length ? `<ul class="mb-0">${cms.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>` : '<div class="text-muted">No countermeasures listed.</div>';
                const rf = it?.related_framework ? `<div class="text-muted small">Related framework: ${escapeHtml(it.related_framework)}</div>` : '';
                return `
                    <div class="list-group-item">
                        <div><strong>${escapeHtml(it?.name || 'Bias')}</strong></div>
                        ${rf}
                        <div class="mt-2"><strong>Description:</strong> ${escapeHtml(it?.description || '')}</div>
                        <div class="mt-1"><strong>Impact:</strong> ${escapeHtml(it?.impact || '')}</div>
                        <div class="mt-2"><strong>Countermeasures:</strong>${cmsHtml}</div>
                    </div>
                `;
            })
        ));

        sections.push(renderSectionCard(
            'Role Gap Analysis',
            renderItemList(analysis.role_gap_analysis, (it) => `
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div><strong>${escapeHtml(it?.competency || 'Competency')}</strong></div>
                        <div>${it?.severity ? badge(it.severity, it.severity) : ''}</div>
                    </div>
                    <div class="mt-2"><strong>Observation:</strong> ${escapeHtml(it?.observation || '')}</div>
                    <div class="mt-1"><strong>Target expectation:</strong> ${escapeHtml(it?.target_expectation || '')}</div>
                    <div class="mt-1"><strong>Recommended action:</strong> ${escapeHtml(it?.recommended_action || '')}</div>
                    <div class="mt-1 text-muted small">Linked target: ${escapeHtml(it?.linked_target_id || '—')}</div>
                </div>
            `)
        ));

        const kbRelated = (kb.related && Array.isArray(kb.related)) ? kb.related : [];
        sections.push(renderSectionCard(
            'Knowledge Base Context',
            kbRelated.length ? renderItemList(kbRelated, (it) => `
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div><strong>${escapeHtml(it?.heading || 'Resource')}</strong></div>
                        <div class="text-muted small">${escapeHtml(it?.tier || '')}</div>
                    </div>
                    <div class="mt-1 text-muted small">${escapeHtml(it?.category || '')}</div>
                    <div class="mt-2">${escapeHtml(it?.content || '')}</div>
                </div>
            `) : '<div class="text-muted">No KB context.</div>'
        ));

        reportSections.innerHTML = sections.join('');
    }

    function setDownloadEnabled(enabled) {
        downloadBtn.disabled = !enabled;
    }

    function downloadJson(obj) {
        const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `diagnostic_${jobId}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    downloadBtn.addEventListener('click', function(){
        if (lastPayload) downloadJson(lastPayload);
    });

    async function pollJob() {
        setError(null);
        statusText.textContent = 'Loading...';
        renderJson({ success: true, status: 'loading', job_id: jobId });
        renderHumanReport(null);
        setDownloadEnabled(false);

        const url = new URL('{{ url_for("api.analyze_event_job_status", job_id="__JOB__") }}'.replace('__JOB__', encodeURIComponent(jobId)), window.location.origin);

        const start = Date.now();
        while (true) {
            const elapsed = Math.round((Date.now() - start) / 1000);
            statusText.textContent = `Polling... (${elapsed}s)`;

            let resp;
            let data;
            try {
                resp = await fetch(url.toString(), { credentials: 'same-origin', headers: { 'Accept': 'application/json' } });
                data = await resp.json().catch(() => ({}));
            } catch (e) {
                setError('Failed to fetch job status: ' + (e?.message || e));
                statusText.textContent = '';
                return;
            }

            if (!resp.ok) {
                setError(data?.error || `Failed to fetch job status (HTTP ${resp.status}).`);
                statusText.textContent = '';
                return;
            }

            createdAt.textContent = data?.created_at || '—';
            startedAt.textContent = data?.started_at || '—';

            if (data && data.success && data.analysis) {
                statusText.textContent = 'Completed';
                lastPayload = data;
                renderJson(data);
                renderHumanReport(data);
                setDownloadEnabled(true);
                return;
            }

            if (data && data.status === 'failed') {
                statusText.textContent = 'Failed';
                setError(data?.error || 'Analysis failed.');
                lastPayload = data;
                renderJson(data);
                renderHumanReport(data);
                setDownloadEnabled(true);
                return;
            }

            if ((Date.now() - start) > 600000) {
                statusText.textContent = 'Timed out';
                setError('Timed out waiting for analysis results.');
                return;
            }

            renderJson(data || { success: true, status: 'unknown', job_id: jobId });
            await new Promise(r => setTimeout(r, 2000));
        }
    }

    pollJob();
</script>
{% endblock %}
