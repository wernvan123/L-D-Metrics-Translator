{% extends "base.html" %}

{% block content %}
<style>
  /* Minimal, page-local styles for Reports UX */
  .table { width: 100%; border-collapse: separate; border-spacing: 0; }
  .table th, .table td { padding: 10px 14px; vertical-align: middle; }
  /* Extra spacing between Date and Status */
  .table td:nth-child(3), .table th:nth-child(3) { padding-right: 24px; }
  /* Status badges */
  .status-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  .status-badge.ok { background: #e8fbef; color: #0e6b3b; border-color: #c9f3df; }
  .status-badge.info { background: #eef7ff; color: #0a67a3; border-color: #cfe7ff; }
  .status-badge.err { background: #ffe9ef; color: #8a1231; border-color: #ffd0db; }
  .status-badge.muted { background: #f3f4f6; color: #6b7280; border-color: #e5e7eb; }
  /* Make the filter input a bit wider on desktop */
  #report-search { min-width: 280px; }
  @media (max-width: 640px){ #report-search { min-width: 0; width: 100%; } }
</style>
<section class="page reports">
  <div class="card">
    <div class="card-header">
      <h2>Reports</h2>
      <div class="actions">
        <button id="sort-date" class="btn" title="Toggle sort by Date">Sort: Date</button>
        <button id="sort-status" class="btn" title="Toggle sort by Status">Sort: Status</button>
        <button id="btn-compare" class="btn" disabled>Compare Reports</button>
      </div>
    </div>
    <div class="card-body">
      {% if not is_admin %}
      <div class="notice" style="margin-bottom:12px;">
        Limited access: some administrative actions are disabled for your account.
      </div>
      {% endif %}
      <div class="row" style="gap:12px;align-items:center;margin-top:8px;margin-bottom:12px;">
        <label for="report-search">Search</label>
        <input id="report-search" placeholder="Search reports..." />
      </div>
      <table class="table">
        <thead>
          <tr>
            <th style="width:36px"></th>
            <th>Title</th>
            <th>Date</th>
            <th>Status</th>
            <th style="width:200px">Actions</th>
          </tr>
        </thead>
        <tbody id="reports-tbody">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  window.IS_ADMIN = {{ is_admin | tojson }};
  // simple cache-busting marker for this page
  window.__REPORTS_LIST_BUILD__ = '2025-09-16';
  // Optional: expose for debugging
  console.debug('[Reports] is_admin =', window.IS_ADMIN);
</script>
<script src="{{ url_for('static', filename='js/reports-list.js') }}?v=20250916"></script>
{% endblock %}
