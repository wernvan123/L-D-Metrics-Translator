{% extends "base.html" %}

{% block content %}
<section class="page reports">
  <style>
    /* Scoped to reports page */
    .page.reports .card-header { padding-bottom: 14px; }
    .page.reports .card-header h2 { margin: 0 0 10px; }
    .page.reports .filters-row { gap: 12px; align-items: center; margin: 0 0 16px; }
    .page.reports table.table { width: 100%; border-collapse: collapse; }
    .page.reports table.table th,
    .page.reports table.table td { text-align: left; vertical-align: middle; }
    .page.reports table.table th { font-weight: 600; }
    /* Increase spacing between action buttons */
    .page.reports td:last-child .btn { margin: 6px 8px 6px 0; }
    .page.reports td:last-child .btn:last-child { margin-right: 0; }
  </style>
  <div class="card">
    <div class="card-header">
      <h2>Reports</h2>
      <div class="actions">
        <button id="btn-compare" class="btn" disabled>Compare Reports</button>
      </div>
    </div>
    <div class="card-body">
      <div class="row filters-row">
        <label for="report-search">Search</label>
        <input id="report-search" placeholder="Search reports..." />
      </div>
      <table class="table">
        <thead>
          <tr>
            <th style="width:36px"></th>
            <th>Title</th>
            <th>Date</th>
            <th>Status</th>
            <th style="width:120px">Actions</th>
          </tr>
        </thead>
        <tbody id="reports-tbody">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reports-list.js') }}?v=20250916"></script>
{% endblock %}
