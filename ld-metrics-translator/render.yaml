services:
  - type: web
    name: ld-metrics-translator
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT main:app"
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ld-metrics-db
          property: connectionString

databases:
  - name: ld-metrics-db
    databaseName: ld_metrics
    user: ld_user
